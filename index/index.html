<style>
:root{
  color-scheme: dark;
  --bg:#07060d; --ink:#ffffff; --soft:rgba(255,255,255,.78); --glow:#8b5cff; --glow2:#ff4fa3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Orbitron","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow-x:hidden}
:focus-visible{outline:3px solid #fff;outline-offset:4px;border-radius:.5rem}

/* Background */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.45}
.bg i:nth-child(1){background:var(--glow);top:-20vmax;left:-15vmax}
.bg i:nth-child(2){background:var(--glow2);bottom:-25vmax;right:-15vmax;opacity:.35}
.bgvid{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.bgvid[hidden]{display:none}
.shade{position:fixed;inset:0;z-index:0;pointer-events:none;display:none;
  background-color:rgba(0,0,0,.3);
  background-image:radial-gradient(rgba(0,0,0,.45) 1px,transparent 1.3px);background-size:3px 3px}
body.has-video .shade{display:block}
body.has-video .bg{display:none}

#trail{position:fixed;inset:0;z-index:2;pointer-events:none}

/* Enter screen */
#gate{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:var(--bg);
  border:0;color:var(--ink);font:inherit;font-size:1.05rem;cursor:pointer;width:100%;
  transition:opacity .6s,visibility .6s}
#gate span{color:var(--soft)}
#gate.gone{opacity:0;visibility:hidden}

/* Mute button */
#mute{display:none;position:fixed;z-index:3;top:calc(1rem + env(safe-area-inset-top,0px));left:max(1rem,env(safe-area-inset-left,0px));
  width:2.9rem;height:2.9rem;border-radius:.85rem;place-items:center;cursor:pointer;color:#fff;
  background:rgba(255,255,255,.18);border:0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
body.in.has-video #mute{display:grid}
#mute:hover{background:rgba(255,255,255,.28)}
#mute svg{width:1.5rem;height:1.5rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#mute .x{display:none}
#mute.off .on{display:none}
#mute.off .x{display:inline}

/* Profile layout */
main{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;padding:2rem 1.25rem 2.5rem}
.profile{display:flex;align-items:center;gap:2.25rem;max-width:44rem;
  opacity:0;transform:translateY(12px);transition:opacity .7s .2s,transform .7s .2s}
body.in .profile{opacity:1;transform:none}
.avatar{flex:none;width:10.75rem;height:10.75rem;border-radius:50%;overflow:hidden;background:#000;
  box-shadow:0 0 40px rgba(0,0,0,.45)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.info{min-width:0}
h1{margin:0;font-size:clamp(2.1rem,6vw,3.2rem);font-weight:700;line-height:1.05;letter-spacing:.01em;
  text-shadow:0 0 14px rgba(255,255,255,.55),0 2px 12px rgba(0,0,0,.5)}
h1{min-height:1.1em;position:relative}
h1::before,h1::after{content:attr(data-text);position:absolute;inset:0;text-align:inherit;pointer-events:none;
  opacity:0;text-shadow:none;mix-blend-mode:screen}
h1::before{color:#00e5ff}
h1::after{color:#ff2bd6}
h1:hover::before,h1.glitch::before{opacity:.9;animation:gl1 .32s steps(2) infinite}
h1:hover::after,h1.glitch::after{opacity:.9;animation:gl2 .32s steps(2) infinite}
h1:hover #name,h1.glitch #name{animation:gl0 .32s steps(2) infinite}
@keyframes gl1{0%{transform:translate(-3px,0);clip-path:inset(10% 0 55% 0)}25%{transform:translate(3px,1px);clip-path:inset(60% 0 8% 0)}
  50%{transform:translate(-2px,-1px);clip-path:inset(30% 0 35% 0)}75%{transform:translate(2px,0);clip-path:inset(75% 0 0 0)}100%{transform:translate(-3px,0);clip-path:inset(0 0 70% 0)}}
@keyframes gl2{0%{transform:translate(3px,0);clip-path:inset(55% 0 10% 0)}25%{transform:translate(-3px,-1px);clip-path:inset(8% 0 60% 0)}
  50%{transform:translate(2px,1px);clip-path:inset(35% 0 30% 0)}75%{transform:translate(-2px,0);clip-path:inset(0 0 75% 0)}100%{transform:translate(3px,0);clip-path:inset(70% 0 0 0)}}
@keyframes gl0{0%,100%{transform:none}30%{transform:translate(1px,0) skewX(-4deg)}60%{transform:translate(-1px,0) skewX(3deg)}}

#name::after{content:"";display:inline-block;width:3px;height:.85em;background:#fff;margin-left:5px;vertical-align:-.05em;box-shadow:0 0 10px rgba(255,255,255,.7);animation:blink 1s steps(1) infinite}
.tag{min-height:1.5em;margin:.5rem 0 0;font-weight:500;font-size:1.05rem;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.tag::after{content:"";display:inline-block;width:2px;height:1em;background:#fff;margin-left:3px;vertical-align:-.12em;
  animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.bio{margin:.9rem 0 0;max-width:24rem;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:.95rem;line-height:1.5;color:var(--soft);text-shadow:0 2px 10px rgba(0,0,0,.7)}
.countdown{margin-top:1.15rem}
.cd-label{margin:0 0 .5rem;font-size:.85rem;font-weight:500;color:var(--soft);text-shadow:0 2px 10px rgba(0,0,0,.6)}
.cd-row{display:flex;gap:1.1rem}
.cd-row div{min-width:3.1rem}
.cd-row b{display:block;font-size:1.7rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;
  text-shadow:0 0 12px rgba(255,255,255,.55),0 2px 10px rgba(0,0,0,.5)}
.cd-row span{display:block;font-size:.65rem;color:var(--soft);text-shadow:0 2px 8px rgba(0,0,0,.6)}
.cd-done{font-size:1.4rem;font-weight:700;text-shadow:0 0 14px rgba(255,255,255,.55),0 2px 10px rgba(0,0,0,.5)}
.icons{display:flex;align-items:center;gap:.9rem;margin-top:1.1rem}
.icons a{display:grid;place-items:center;color:#fff;transition:transform .15s}
.icons a:hover{transform:scale(1.14)}
.icons svg{width:2.2rem;height:2.2rem;fill:currentColor;filter:drop-shadow(0 0 7px rgba(255,255,255,.75))}
.icons .wing{width:2.2rem;height:2.2rem;fill:#fff;opacity:.9;filter:drop-shadow(0 0 7px rgba(255,255,255,.75));flex:none}
.icons .wing.r{transform:scaleX(-1)}

/* Avatar wrapper, Discord status dot, presence line */
.avwrap{position:relative;flex:none;transition:transform .18s ease-out;will-change:transform}
.status{position:absolute;right:.85rem;bottom:.85rem;width:1.5rem;height:1.5rem;border-radius:50%;
  background:var(--c,#747f8d);border:4px solid #0b0916;box-shadow:0 0 12px var(--c,#747f8d)}
.status[hidden]{display:none}
.presence{display:flex;align-items:center;gap:.5rem;margin:.95rem 0 0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:.85rem;color:var(--soft);text-shadow:0 2px 10px rgba(0,0,0,.7)}
.presence[hidden]{display:none}
.pd{width:.6rem;height:.6rem;border-radius:50%;flex:none;background:var(--c,#747f8d);box-shadow:0 0 8px var(--c,#747f8d)}

/* Featured video card */
.featured{display:block;width:min(20rem,100%);text-decoration:none;color:#fff;border-radius:1rem;overflow:hidden;
  background:rgba(12,10,26,.55);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  opacity:0;transform:translateY(12px);transition:opacity .7s .5s,transform .7s .5s,border-color .15s}
.featured[hidden]{display:none}
body.in .featured{opacity:1;transform:none}
.featured:hover{border-color:rgba(255,255,255,.5)}
.ft{display:block;position:relative;aspect-ratio:16/9;background:#000}
.ft img{width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;inset:0;margin:auto;width:3.2rem;height:3.2rem;border-radius:50%;display:grid;place-items:center;
  background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.8)}
.play svg{width:1.4rem;height:1.4rem;fill:#fff;margin-left:.1rem}
.fl{display:block;padding:.7rem .9rem 0;font-size:.7rem;color:var(--soft)}
.fname{display:block;padding:.1rem .9rem .8rem;font-size:.95rem;font-weight:700;line-height:1.35}

/* Visitor counter */
.views{position:relative;z-index:2;
  display:flex;align-items:center;gap:.45rem;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:.85rem;
  color:var(--soft);text-shadow:0 2px 10px rgba(0,0,0,.7);pointer-events:none;opacity:0;transition:opacity .7s .6s}
.views[hidden]{display:none}
body.in .views{opacity:1}
.views svg{width:1.1rem;height:1.1rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Easter egg */
.spark{position:fixed;z-index:6;width:.5rem;height:.5rem;margin:-.25rem 0 0 -.25rem;border-radius:50%;pointer-events:none;
  background:var(--c);box-shadow:0 0 10px var(--c);animation:burst .9s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.egg{position:fixed;z-index:6;left:50%;top:12%;transform:translateX(-50%);max-width:90vw;text-align:center;padding:.75rem 1.2rem;border-radius:.9rem;
  background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.3);font-weight:700;text-shadow:0 0 12px rgba(255,255,255,.6);
  animation:eggin .4s ease-out}
@keyframes eggin{from{opacity:0;transform:translate(-50%,-10px)}}
body.shake main{animation:shake .5s}
@keyframes shake{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,0)}}

@media (max-width:640px){
  .profile{flex-direction:column;text-align:center;gap:1.5rem}
  .avatar{width:9.5rem;height:9.5rem}
  .bio{margin-left:auto;margin-right:auto}
  .icons{justify-content:center}
  .cd-row{justify-content:center}
  .presence{justify-content:center}
  .status{right:.6rem;bottom:.6rem}
}
@media (prefers-reduced-motion: reduce){
  .profile{transition:none;opacity:1;transform:none}
  .tag::after,#name::after{animation:none}
  h1::before,h1::after{display:none}
  .avwrap{transform:none!important}
  .spark{display:none}
  body.shake main{animation:none}
  .featured,.views{transition:none}
  #gate{transition:none}
}
</style>
</head>

<script>
(function(){
  var gate=document.getElementById('gate'), tag=document.getElementById('tag'),
      body=document.body, vid=document.getElementById('bgvid'), mute=document.getElementById('mute');
  var lines=['creator','video editor','content maker'];
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var li=0, ci=0, del=false;
  function tick(){
    var w=lines[li];
    tag.textContent=w.slice(0,ci);
    if(!del&&ci===w.length){del=true;return setTimeout(tick,1400)}
    if(del&&ci===0){del=false;li=(li+1)%lines.length}
    ci+=del?-1:1;
    setTimeout(tick,del?45:90);
  }
  if(reduce){tag.textContent=lines[0]}else{tick()}

  /* Name types out, erases, and types again on repeat */
  var nameEl=document.getElementById('name'), nm='Klyps', ni=0, nd=false;
  function nameTick(){
    nameEl.textContent=nm.slice(0,ni);nameEl.parentNode.setAttribute('data-text',nameEl.textContent);
    if(!nd&&ni===nm.length){nd=true;return setTimeout(nameTick,1800)}
    if(nd&&ni===0){nd=false;return setTimeout(nameTick,500)}
    ni+=nd?-1:1;
    setTimeout(nameTick,nd?110:170);
  }
  if(!reduce){ni=0;nameTick()}

  /* Name glitch: on hover (CSS) plus a quick glitch every few seconds */
  var h1=document.querySelector('h1');
  if(!reduce){setInterval(function(){h1.classList.add('glitch');setTimeout(function(){h1.classList.remove('glitch')},360)},6500)}

  /* Avatar tilts toward the mouse (mouse only) */
  var avEl=document.querySelector('.avwrap');
  if(!reduce&&window.matchMedia('(pointer: fine)').matches){
    window.addEventListener('pointermove',function(e){
      if(e.pointerType&&e.pointerType!=='mouse')return;
      var r=avEl.getBoundingClientRect(),
          dx=(e.clientX-(r.left+r.width/2))/Math.max(innerWidth*.45,300),
          dy=(e.clientY-(r.top+r.height/2))/Math.max(innerHeight*.45,300);
      dx=Math.max(-1,Math.min(1,dx));dy=Math.max(-1,Math.min(1,dy));
      avEl.style.transform='perspective(600px) rotateX('+(-dy*16).toFixed(1)+'deg) rotateY('+(dx*16).toFixed(1)+'deg) scale(1.03)';
    });
    document.addEventListener('mouseleave',function(){avEl.style.transform=''});
  }

  /* ---- Settings you can edit ---- */
  var DISCORD_ID='1031672009752596490';
  var FEATURED_VIDEO_ID='';   /* paste a YouTube video ID, e.g. dQw4w9WgXcQ */
  var FEATURED_TITLE='';      /* the title shown on the card */

  /* Featured video card (stays hidden until FEATURED_VIDEO_ID is filled in) */
  (function(){
    if(!FEATURED_VIDEO_ID)return;
    var id=encodeURIComponent(FEATURED_VIDEO_ID), card=document.getElementById('featured');
    card.href='https://www.youtube.com/watch?v='+id;
    document.getElementById('fthumb').src='https://i.ytimg.com/vi/'+id+'/hqdefault.jpg';
    document.getElementById('fname').textContent=FEATURED_TITLE||'Watch on YouTube';
    card.hidden=false;
  })();

  /* Live Discord status through Lanyard (you must be in discord.gg/lanyard) */
  (function(){
    var dot=document.getElementById('status'), pres=document.getElementById('presence'),
        pd=document.getElementById('pd'), ptext=document.getElementById('ptext'),
        colors={online:'#3ba55d',idle:'#faa61a',dnd:'#ed4245',offline:'#747f8d'};
    function textFor(d){
      if(d.listening_to_spotify&&d.spotify)return 'Listening to '+d.spotify.song+' \u2013 '+d.spotify.artist;
      var acts=d.activities||[], a=acts.filter(function(x){return x.type!==4})[0];
      if(a)return (a.type===2?'Listening to ':a.type===3?'Watching ':'Playing ')+a.name;
      var c=acts.filter(function(x){return x.type===4&&x.state})[0];
      if(c)return c.state;
      return {online:'Online on Discord',idle:'Idle',dnd:'Do not disturb',offline:'Offline'}[d.discord_status]||'';
    }
    function poll(){
      fetch('https://api.lanyard.rest/v1/users/'+DISCORD_ID).then(function(r){return r.json()}).then(function(j){
        if(!j||!j.success||!j.data){dot.hidden=true;pres.hidden=true;return}
        var d=j.data, c=colors[d.discord_status]||colors.offline;
        dot.style.setProperty('--c',c);dot.hidden=false;
        pd.style.setProperty('--c',c);
        ptext.textContent=textFor(d);pres.hidden=!ptext.textContent;
      }).catch(function(){});
    }
    poll();setInterval(poll,30000);
  })();

  /* Visitor counter (Abacus). Counts once per browser session. */
  (function(){
    var box=document.getElementById('views'), num=document.getElementById('vnum'), counted=false;
    try{counted=sessionStorage.getItem('counted')==='1'}catch(e){}
    fetch('https://abacus.jasoncameron.dev/'+(counted?'get':'hit')+'/klyps-lol/visits')
      .then(function(r){return r.json()}).then(function(j){
        if(!j||j.value==null)return;
        num.textContent=Number(j.value).toLocaleString('en-US');box.hidden=false;
        if(!counted){try{sessionStorage.setItem('counted','1')}catch(e){}}
      }).catch(function(){});
  })();

  /* Hidden easter egg: click the profile picture 5 times fast */
  (function(){
    var clicks=[];
    function egg(){
      var r=avEl.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2, cols=['#ffffff','#cdbcff','#ff9fd0','#00e5ff'];
      if(!reduce){
        for(var i=0;i<40;i++){
          var s=document.createElement('span'), a=Math.random()*6.283, d=90+Math.random()*180;
          s.className='spark';s.style.left=cx+'px';s.style.top=cy+'px';
          s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');
          s.style.setProperty('--c',cols[i%cols.length]);
          document.body.appendChild(s);
          (function(el){setTimeout(function(){el.remove()},1000)})(s);
        }
        body.classList.add('shake');h1.classList.add('glitch');
        setTimeout(function(){body.classList.remove('shake');h1.classList.remove('glitch')},900);
      }
      var t=document.createElement('div');
      t.className='egg';t.setAttribute('role','status');
      t.textContent='You found the secret. The comeback is real.';
      document.body.appendChild(t);
      setTimeout(function(){t.remove()},3800);
    }
    avEl.addEventListener('click',function(){
      var now=Date.now();
      clicks=clicks.filter(function(t){return now-t<3000});clicks.push(now);
      if(clicks.length>=5){clicks=[];egg()}
    });
  })();

  function playIt(){var p=vid.play();if(p&&p.catch)p.catch(function(){vid.muted=true;var q=vid.play();if(q&&q.catch)q.catch(function(){})})}
  function showVideo(){vid.hidden=false;body.classList.add('has-video');playIt()}
  function hideVideo(){vid.hidden=true;body.classList.remove('has-video');vid.pause()}
  function sync(){var m=vid.muted||vid.volume===0;mute.classList.toggle('off',m);mute.setAttribute('aria-label',m?'Unmute sound':'Mute sound')}
  vid.volume=0.5;
  vid.addEventListener('loadeddata',showVideo);
  vid.addEventListener('error',hideVideo);
  vid.addEventListener('volumechange',sync);
  mute.addEventListener('click',function(){vid.muted=!vid.muted;if(!vid.muted&&vid.volume===0){vid.volume=0.5}playIt()});
  gate.addEventListener('click',function(){
    gate.classList.add('gone');body.classList.add('in');
    vid.volume=0.5;vid.muted=false;
    if(vid.currentSrc){playIt()}
    sync();
  });
  /* Comeback countdown: midnight Eastern, December 10, 2026 */
  var target=new Date('2026-12-10T00:00:00-05:00').getTime();
  var cdl=document.getElementById('cdl'), cdr=document.getElementById('cdr'),
      cdD=document.getElementById('cd-d'), cdH=document.getElementById('cd-h'),
      cdM=document.getElementById('cd-m'), cdS=document.getElementById('cd-s');
  function pad(n){return n<10?'0'+n:String(n)}
  function cdTick(){
    var ms=target-Date.now();
    if(ms<=0){cdl.textContent='';cdr.innerHTML='<p class="cd-done">I’m back.</p>';return}
    var s=Math.floor(ms/1000);
    cdD.textContent=pad(Math.floor(s/86400));
    cdH.textContent=pad(Math.floor(s%86400/3600));
    cdM.textContent=pad(Math.floor(s%3600/60));
    cdS.textContent=pad(s%60);
    setTimeout(cdTick,1000-(Date.now()%1000));
  }
  cdTick();

  vid.src='background.mp4';
  sync();

  /* Sparkle cursor trail (mouse only) */
  (function(){
    if(reduce||!window.matchMedia('(pointer: fine)').matches)return;
    var cv=document.getElementById('trail'), cx=cv.getContext('2d'), dpr=Math.min(window.devicePixelRatio||1,2),
        ps=[], raf=0, lx=null, ly=null, cols=['#ffffff','#cdbcff','#ff9fd0'];
    function size(){cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}
    size();window.addEventListener('resize',size);
    function star(x,y,r){cx.beginPath();for(var i=0;i<8;i++){var a=i*Math.PI/4,rad=i%2?r*0.3:r;cx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad)}cx.closePath();cx.fill()}
    function frame(){
      cx.clearRect(0,0,innerWidth,innerHeight);
      for(var i=ps.length-1;i>=0;i--){
        var p=ps[i];p.life--;
        if(p.life<=0){ps.splice(i,1);continue}
        p.x+=p.vx;p.y+=p.vy;p.vy+=0.02;
        var t=p.life/p.max;
        cx.globalAlpha=t;cx.fillStyle=p.c;cx.shadowColor=p.c;cx.shadowBlur=10;
        star(p.x,p.y,p.r*(0.4+0.6*t));
      }
      cx.globalAlpha=1;cx.shadowBlur=0;
      raf=ps.length?requestAnimationFrame(frame):0;
    }
    window.addEventListener('pointermove',function(e){
      if(e.pointerType&&e.pointerType!=='mouse')return;
      if(lx!==null&&Math.hypot(e.clientX-lx,e.clientY-ly)<8)return;
      lx=e.clientX;ly=e.clientY;
      for(var k=0;k<2;k++){
        var m=30+Math.random()*25;
        ps.push({x:lx+(Math.random()-.5)*8,y:ly+(Math.random()-.5)*8,vx:(Math.random()-.5)*.9,vy:(Math.random()-.5)*.9,
                 life:m,max:m,r:3+Math.random()*4,c:cols[Math.floor(Math.random()*cols.length)]});
      }
      if(ps.length>120)ps.splice(0,ps.length-120);
      if(!raf)raf=requestAnimationFrame(frame);
    });
  })();
})();
</script>
